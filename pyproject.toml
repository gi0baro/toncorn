[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "toncorn"
dynamic = ["version"]
description = "A tonio-powered fork of uvicorn."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE.md"]
requires-python = ">=3.14"
authors = [
    { name = "Marcelo Trylesinski", email = "marcelotryle@gmail.com" },
]
maintainers = [
    { name = "Giovanni Barillari", email = "g@baro.dev" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "click>=7.0",
    "h11>=0.8",
    "tonio~=0.7.0",
]

[project.optional-dependencies]
standard = [
    "httptools>=0.6.3",
    "python-dotenv>=0.13",
    "PyYAML>=5.1",
    "websockets>=10.4",
]

[dependency-groups]
dev = [
    # We add toncorn[standard] so `uv sync` considers the extras.
    "toncorn[standard]",
    "ruff==0.15.1",
    "pytest==9.0.3",
    "pytest-mock==3.15.1",
    "mypy==1.19.1",
    "types-click==7.1.8",
    "types-pyyaml==6.0.12.20250915",
    "trustme==1.2.1",
    "cryptography>=44.0.3",
    "coverage==7.13.4",
    "coverage-conditional-plugin==0.9.0",
    "coverage-enable-subprocess==1.0",
    "httpx==0.28.1",
    # check dist
    "twine==6.2.0",
    # Explicit optionals,
    "a2wsgi==1.10.10",
    "wsproto==1.3.2",
    "websockets==13.1",
]
docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.1",
    "mkdocstrings-python==2.0.2",
    "mkdocs-llmstxt==0.5.0",
]

[tool.uv]
default-groups = ["dev", "docs"]
required-version = ">=0.9.17"
exclude-newer = "7 days"

[tool.uv.exclude-newer-package]
tonio = "2026-06-22"

[project.scripts]
toncorn = "uvicorn.main:main"

[project.urls]
Changelog = "https://uvicorn.dev/release-notes"
Funding = "https://github.com/sponsors/encode"
Homepage = "https://uvicorn.dev/"
Source = "https://github.com/Kludex/uvicorn"

[tool.hatch.version]
source = "code"
path = "toncorn/_version.py"

[tool.hatch.build.targets.sdist]
include = ["/uvicorn", "/toncorn", "/tests"]

[tool.hatch.build.targets.wheel]
packages = ["uvicorn", "toncorn"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "FA", "UP"]
ignore = ["B904", "B028", "UP031"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.mypy]
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
disallow_untyped_defs = false
ignore_missing_imports = true
follow_imports = "silent"

[tool.pytest.ini_options]
addopts = "-rxXs --strict-config --strict-markers"
xfail_strict = true
filterwarnings = [
    "error",
    "ignore:Uvicorn's native WSGI implementation is deprecated.*:DeprecationWarning",
    "ignore: remove second argument of ws_handler:DeprecationWarning:websockets",
    "ignore: websockets.legacy is deprecated.*:DeprecationWarning",
    "ignore: websockets.server.WebSocketServerProtocol is deprecated.*:DeprecationWarning",
    "ignore: websockets.client.connect is deprecated.*:DeprecationWarning",
    # httptools in Python 3.14t needs the `PYTHON_GIL=0` environment variable, or raises a RuntimeWarning.
    "ignore: The global interpreter lock (GIL)*:RuntimeWarning",
    # tonio's runtime teardown leaks its self-pipe socket on shutdown.
    "ignore::ResourceWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
parallel = true
source_pkgs = ["uvicorn", "tests"]
plugins = ["coverage_conditional_plugin"]
omit = ["uvicorn/__main__.py", "toncorn/__main__.py"]

[tool.coverage.report]
precision = 2
fail_under = 100
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "pragma: nocover",
    "pragma: full coverage",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.coverage.coverage_conditional_plugin.rules]
py-linux = "sys_platform == 'linux'"
py-not-linux = "sys_platform != 'linux'"
py-darwin = "sys_platform == 'darwin'"

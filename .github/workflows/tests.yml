name: Tests

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - tonio
  push:
    branches:
      - tonio

env:
  PYTHON_GIL: 0

jobs:
  Linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.14t]

    steps:
    - uses: actions/checkout@v6
    - uses: astral-sh/setup-uv@v7
      with:
        enable-cache: false
    - name: Install
      run: |
        uv python install ${{ matrix.python-version }}
        uv venv .venv
        uv sync --all-extras --group dev
    - name: Test
      run: |
        uv run pytest -v tests

  MacOS:
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: [3.14t]

    steps:
    - uses: actions/checkout@v6
    - uses: astral-sh/setup-uv@v7
      with:
        enable-cache: false
    - name: Install
      run: |
        uv python install ${{ matrix.python-version }}
        uv venv .venv
        uv sync --dev
    - name: Test
      run: |
        uv run pytest -v tests
